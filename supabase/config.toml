# Configuração do Supabase LOCAL (`supabase start`). Não afeta o projeto hospedado: para ele,
# aplique os mesmos ajustes no painel (veja docs/BACKEND.md, seção "Projeto hospedado").
# NOTA: este arquivo não pôde ser validado com a CLI no ambiente em que foi escrito.
project_id = "esctiroio"

[api]
enabled = true
port = 54321
# "private" (funções de autorização) NÃO é exposto pela API.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
# Seed apenas de DESENVOLVIMENTO LOCAL (lojas fictícias). Não roda em `db push`.
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# SEM cadastro público: contas só nascem por convite (Edge Function).
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[functions.invite-member]
verify_jwt = true
