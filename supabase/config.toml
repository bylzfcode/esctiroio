# Configuração do Supabase LOCAL (`supabase start`). Não afeta o projeto hospedado: para ele,
# aplique os mesmos ajustes no painel (veja docs/BACKEND.md, seção "Projeto hospedado").
# Validado com a Supabase CLI 3.1.0 (`supabase start`): sem avisos.
project_id = "esctiroio"

[api]
enabled = true
port = 54321
# "private" (funções de autorização) NÃO é exposto pela API.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
# Seed apenas de DESENVOLVIMENTO LOCAL (lojas fictícias). Não roda em `db push`.
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# SEM cadastro público: contas só nascem por convite (Edge Function).
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
# O cadastro público é desligado pelo `enable_signup = false` de [auth] (verificado: signup_disabled).
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.rate_limit]
# SÓ LOCAL: a validação dispara dezenas de convites. Em um projeto hospedado o limite de e-mails do
# Auth é GLOBAL (não por pessoa) e vem do painel: por isso o limite por pessoa fica no banco
# (reserve_invite_slot). Ajuste os limites do painel conforme seu SMTP.
email_sent = 200
sign_in_sign_ups = 300
token_refresh = 300

[functions.invite-member]
verify_jwt = true
